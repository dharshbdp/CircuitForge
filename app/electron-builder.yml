appId: io.circuitforge.desktop
productName: CircuitForge
copyright: Copyright © 2026 CircuitForge Team
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: CircuitForge
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: CircuitForge-${version}-Windows-Setup.${ext}
  shortcutName: CircuitForge
  uninstallDisplayName: CircuitForge
  createDesktopShortcut: always
  createStartMenuShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: CircuitForge-${version}-Windows-Portable.${ext}
mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device camera.
    - NSMicrophoneUsageDescription: Application requests access to the device microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to documents for project files.
    - NSDownloadsFolderUsageDescription: Application requests access to downloads for firmware and library downloads.
  notarize: false
dmg:
  artifactName: CircuitForge-${version}-macOS-${arch}.${ext}
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  maintainer: CircuitForge Team <support@circuitforge.dev>
  category: Development
appImage:
  artifactName: CircuitForge-${version}-Linux-${arch}.${ext}
deb:
  artifactName: CircuitForge-${version}-Linux-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: dharshbdp
  repo: CircuitForge
