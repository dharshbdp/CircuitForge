name: Release CircuitForge

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (NSIS & Portable)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows Installer & Portable Executable
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            app/dist/*.exe
            app/dist/*.blockmap

  build-macos:
    name: Build macOS (DMG & ZIP)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build macOS DMG & ZIP
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            app/dist/*.dmg
            app/dist/*.zip

  build-linux:
    name: Build Linux (AppImage & DEB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Linux AppImage & DEB Packages
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            app/dist/*.AppImage
            app/dist/*.deb

  publish:
    name: Publish Standalone GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release-artifacts

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: release-artifacts

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
